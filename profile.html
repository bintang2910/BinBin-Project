<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — BinBin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="app-shell page-transition-up">

    <!-- Top Nav -->
    <nav class="top-nav">
      <div class="nav-logo">
        <a href="index.html" class="icon-btn back-btn" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </a>
        <span class="logo-text" style="font-size:18px;">Profile</span>
      </div>
    </nav>

    <main class="main-content" style="padding-bottom:40px;">

      <!-- Profile Card -->
      <section class="section" style="padding-top:24px;">
        <div class="profile-card">
          <div class="profile-avatar">
            <img src="https://ui-avatars.com/api/?name=Bintang&background=7c3aed&color=fff&size=96&bold=true"
              alt="Bintang" />
          </div>
          <h2 class="profile-name">Bintang</h2>
          <p class="profile-email">bintang@binbin.app</p>
          <div class="profile-stats">
            <div class="profile-stat">
              <strong id="stat-hosted">0</strong>
              <span>Hosted</span>
            </div>
            <div class="profile-stat__divider"></div>
            <div class="profile-stat">
              <strong id="stat-joined">0</strong>
              <span>Joined</span>
            </div>
          </div>
          <!-- Host Reputation -->
          <div class="profile-stats" style="margin-top:12px; background:linear-gradient(135deg,#dcfce7,#bbf7d0); border:1px solid #86efac;">
            <div class="profile-stat">
              <strong id="stat-likes">0</strong>
              <span>👍 Likes</span>
            </div>
            <div class="profile-stat__divider"></div>
            <div class="profile-stat">
              <strong id="stat-dislikes">0</strong>
              <span>👎 Dislikes</span>
            </div>
            <div class="profile-stat__divider"></div>
            <div class="profile-stat">
              <strong id="stat-approval">—</strong>
              <span>⭐ Approval</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Settings Menu -->
      <section class="section">
        <h2 class="section-title" style="font-size:15px; margin-bottom:14px;">Account</h2>
        <div class="settings-list">
          <a href="#" class="settings-item">
            <div class="settings-item__icon" style="background:#ede9fe; color:var(--purple-600);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
            <span>Edit Profile</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
          <a href="#" class="settings-item">
            <div class="settings-item__icon" style="background:#dbeafe; color:#2563eb;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
                <line x1="1" y1="10" x2="23" y2="10" />
              </svg>
            </div>
            <span>Payment Methods</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
          <a href="#" class="settings-item">
            <div class="settings-item__icon" style="background:#fef3c7; color:#d97706;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
            </div>
            <span>Notifications</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title" style="font-size:15px; margin-bottom:14px;">Support</h2>
        <div class="settings-list">
          <a href="#" class="settings-item">
            <div class="settings-item__icon" style="background:#dcfce7; color:#16a34a;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
              </svg>
            </div>
            <span>Help Center</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
          <a href="#" class="settings-item">
            <div class="settings-item__icon" style="background:#fce7f3; color:#db2777;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
            </div>
            <span>Privacy Policy</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
          <a href="#" class="settings-item">
            <div class="settings-item__icon" style="background:var(--gray-100); color:var(--gray-500);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
              </svg>
            </div>
            <span>About BinBin</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
        </div>
      </section>

      <!-- Log Out -->
      <section class="section" style="padding-top:16px;">
        <button class="btn-logout" onclick="logOut()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Log Out</span>
        </button>
        <p style="text-align:center; font-size:11px; color:var(--gray-400); margin-top:16px;">BinBin v1.0.0 MVP</p>
      </section>

    </main>
  </div>

  <script src="api-config.js"></script>
  <script>

    // Load real user data on page load
    (async function loadProfile() {
      try {
        const res = await fetch(`${API}/api/auth/get-session`, {
          credentials: 'include',
        });

        if (!res.ok) {
          // Not logged in → redirect to login
          window.location.href = 'login.html';
          return;
        }

        const data = await res.json();
        const user = data.user;

        if (user) {
          document.querySelector('.profile-name').textContent = user.name || 'User';
          document.querySelector('.profile-email').textContent = user.email || '';
          const avatarImg = document.querySelector('.profile-avatar img');
          const encodedName = encodeURIComponent(user.name || 'U');
          avatarImg.src = user.image || `https://ui-avatars.com/api/?name=${encodedName}&background=7c3aed&color=fff&size=96&bold=true`;
          avatarImg.alt = user.name || 'User';

          // Load reputation and stats
          try {
            const [repRes, statsRes] = await Promise.all([
              fetch(`${API}/api/users/${user.id}/reputation`),
              fetch(`${API}/api/users/${user.id}/stats`)
            ]);

            const repData = await repRes.json();
            if (repData.data) {
              document.getElementById('stat-likes').textContent = repData.data.likesCount;
              document.getElementById('stat-dislikes').textContent = repData.data.dislikesCount;
              document.getElementById('stat-approval').textContent = repData.data.totalRatings > 0 ? repData.data.approvalScore + '%' : 'N/A';
            }

            const statsData = await statsRes.json();
            if (statsData.data) {
              document.getElementById('stat-hosted').textContent = statsData.data.totalHosted;
              document.getElementById('stat-joined').textContent = statsData.data.totalJoined;
            }
          } catch {}
        }
      } catch {
        // Network error → redirect to login
        window.location.href = 'login.html';
      }
    })();

    async function logOut() {
      const btn = document.querySelector('.btn-logout');
      btn.innerHTML = '<span class="auth-spinner" style="border-color:rgba(220,38,38,0.3); border-top-color:#dc2626;"></span> Logging out...';
      btn.disabled = true;

      try {
        await fetch(`${API}/api/auth/sign-out`, {
          method: 'POST',
          credentials: 'include',
        });
      } catch {
        // Even if API fails, still redirect
      }
      window.location.href = 'login.html';
    }
  </script>
</body>

</html>
