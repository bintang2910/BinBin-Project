<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet — BinBin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
  <style>
    .wallet-hero { background: linear-gradient(135deg, var(--purple-600), var(--purple-900)); border-radius: var(--radius-lg); padding: 28px 24px; color: white; position: relative; overflow: hidden; }
    .wallet-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.08); }
    .wallet-hero::after { content: ''; position: absolute; bottom: -20px; left: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.06); }
    .wallet-label { font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 500; }
    .wallet-amount { font-size: 36px; font-weight: 800; margin: 8px 0 4px; letter-spacing: -0.5px; }
    .wallet-actions { display: flex; gap: 12px; margin-top: 18px; }
    .wallet-action-btn { flex: 1; padding: 12px; border-radius: var(--radius-md); border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; backdrop-filter: blur(4px); }
    .wallet-action-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
    .wallet-action-btn:active { transform: scale(0.97); }
    .wallet-action-btn--primary { background: rgba(255,255,255,0.95); color: var(--purple-700); border-color: transparent; }
    .wallet-action-btn--primary:hover { background: white; }

    /* Top-up Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 9998; align-items: flex-end; justify-content: center; }
    .modal-overlay.show { display: flex; animation: fadeIn 0.2s both; }
    .modal-sheet { background: white; border-radius: 20px 20px 0 0; padding: 24px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.16,1,0.3,1) both; }
    .modal-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--gray-300); margin: 0 auto 18px; }
    .modal-title { font-size: 20px; font-weight: 800; color: var(--gray-900); margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: var(--gray-500); margin-bottom: 20px; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* Amount Grid */
    .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .amount-chip { padding: 14px 8px; border-radius: var(--radius-md); border: 2px solid var(--gray-200); background: var(--surface-card); font-size: 14px; font-weight: 700; color: var(--gray-800); cursor: pointer; text-align: center; transition: all 0.2s; }
    .amount-chip:hover { border-color: var(--purple-300); background: #f5f3ff; }
    .amount-chip.selected { border-color: var(--purple-600); background: #ede9fe; color: var(--purple-700); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }

    /* Custom Amount */
    .custom-amount-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .custom-amount-row .input-field { flex: 1; margin-bottom: 0; }

    /* Tx History */
    .tx-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--gray-100); }
    .tx-item:last-child { border: none; }
    .tx-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .tx-icon--topup { background: #ecfdf5; }
    .tx-icon--fee { background: #fef3c7; }
    .tx-info { flex: 1; }
    .tx-info strong { font-size: 14px; display: block; color: var(--gray-900); }
    .tx-info span { font-size: 12px; color: var(--gray-500); }
    .tx-amount { font-size: 14px; font-weight: 700; }
    .tx-amount--plus { color: #16a34a; }
    .tx-amount--minus { color: #dc2626; }
  </style>
</head>
<body>
  <div class="app-shell page-transition-up">

    <nav class="top-nav">
      <div class="nav-logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text" style="font-size:18px;">My Wallet</span>
      </div>
    </nav>

    <main class="main-content">

      <!-- Wallet Hero Card -->
      <section class="section" style="padding-top:20px;">
        <div class="wallet-hero">
          <span class="wallet-label">💰 BinBin Balance</span>
          <h2 class="wallet-amount" id="wallet-balance">Rp 0</h2>
          <div class="wallet-actions">
            <button class="wallet-action-btn wallet-action-btn--primary" onclick="openTopUp()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Top Up
            </button>
            <button class="wallet-action-btn" disabled style="opacity:0.5;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Withdraw
            </button>
          </div>
        </div>
      </section>

      <!-- Quick Actions -->
      <section class="section" style="margin-top:8px;">
        <h2 class="section-title" style="font-size:15px; margin-bottom:14px;">Transaction History</h2>
        <div id="tx-history">
          <div style="padding:30px; text-align:center; color:var(--gray-400); font-size:13px;">
            No transactions yet. Top up to get started!
          </div>
        </div>
      </section>

      <div class="bottom-spacer"></div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="index.html" class="bottom-nav__item" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="search.html" class="bottom-nav__item" aria-label="Search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </a>
      <a href="create-group.html" class="bottom-nav__item bottom-nav__item--fab" aria-label="Create Group">
        <div class="fab-circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
      </a>
      <a href="activity.html" class="bottom-nav__item" aria-label="Activity">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Activity</span>
      </a>
      <a href="wallet.html" class="bottom-nav__item bottom-nav__item--active" aria-label="Wallet">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Wallet</span>
      </a>
    </nav>

  </div>

  <!-- Top-Up Modal -->
  <div class="modal-overlay" id="topup-modal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3 class="modal-title">💰 Top Up Balance</h3>
      <p class="modal-sub">Pilih nominal atau masukkan jumlah custom</p>

      <div class="amount-grid" id="amount-grid">
        <button class="amount-chip" data-amount="10000">Rp 10.000</button>
        <button class="amount-chip" data-amount="20000">Rp 20.000</button>
        <button class="amount-chip" data-amount="50000">Rp 50.000</button>
        <button class="amount-chip" data-amount="100000">Rp 100.000</button>
        <button class="amount-chip" data-amount="200000">Rp 200.000</button>
        <button class="amount-chip" data-amount="500000">Rp 500.000</button>
      </div>

      <div class="custom-amount-row">
        <span style="font-size:14px; font-weight:600; color:var(--gray-600);">Rp</span>
        <input type="number" id="custom-amount" class="input-field" placeholder="Jumlah lain..." min="1000" max="1000000">
      </div>

      <button class="btn-primary form-submit" id="btn-topup" onclick="doTopUp()" style="background:var(--purple-600); color:white; width:100%; justify-content:center; margin-top:20px;">
        Konfirmasi Top Up
      </button>
      <button onclick="closeTopUp()" style="width:100%; padding:12px; border:none; background:none; color:var(--gray-500); font-weight:600; font-size:14px; cursor:pointer; margin-top:8px;">
        Batal
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    const API = 'http://' + window.location.hostname + ':3001';
    let selectedAmount = 0;

    function showToast(msg, type = 'info') {
      const ct = document.getElementById('toast-container');
      const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
      const t = document.createElement('div');
      t.className = `toast toast--${type}`;
      t.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span class="toast-msg">${msg}</span>`;
      ct.appendChild(t);
      setTimeout(() => { t.classList.add('toast-exit'); setTimeout(() => t.remove(), 300); }, 4000);
    }

    function formatRp(n) { return 'Rp ' + (n||0).toLocaleString('id-ID'); }

    // ─── Load Balance ───
    async function loadBalance() {
      try {
        const res = await fetch(`${API}/api/wallet/balance`, { credentials: 'include' });
        const json = await res.json();
        if (res.ok) {
          document.getElementById('wallet-balance').textContent = formatRp(json.data.balance);
        }
      } catch (e) {
        console.error('Balance load error:', e);
      }
    }

    // ─── Top Up Modal ───
    function openTopUp() {
      document.getElementById('topup-modal').classList.add('show');
      selectedAmount = 0;
      document.getElementById('custom-amount').value = '';
      document.querySelectorAll('.amount-chip').forEach(c => c.classList.remove('selected'));
    }

    function closeTopUp() {
      document.getElementById('topup-modal').classList.remove('show');
    }

    // Amount chip click
    document.getElementById('amount-grid').addEventListener('click', (e) => {
      const chip = e.target.closest('.amount-chip');
      if (!chip) return;
      document.querySelectorAll('.amount-chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedAmount = parseInt(chip.dataset.amount);
      document.getElementById('custom-amount').value = '';
    });

    // Custom amount changes selection
    document.getElementById('custom-amount').addEventListener('input', (e) => {
      document.querySelectorAll('.amount-chip').forEach(c => c.classList.remove('selected'));
      selectedAmount = parseInt(e.target.value) || 0;
    });

    // Close modal on overlay click
    document.getElementById('topup-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('topup-modal')) closeTopUp();
    });

    // ─── Do Top Up ───
    async function doTopUp() {
      const customVal = parseInt(document.getElementById('custom-amount').value);
      const amount = customVal || selectedAmount;

      if (!amount || amount < 1000) {
        showToast('Minimum top-up Rp 1.000', 'warning');
        return;
      }
      if (amount > 1000000) {
        showToast('Maximum top-up Rp 1.000.000', 'warning');
        return;
      }

      const btn = document.getElementById('btn-topup');
      btn.disabled = true;
      btn.textContent = '⏳ Processing...';

      try {
        const res = await fetch(`${API}/api/wallet/topup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ amount })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Top-up failed');

        showToast(`Berhasil top-up ${formatRp(amount)}!`, 'success');
        document.getElementById('wallet-balance').textContent = formatRp(json.data.balance);
        closeTopUp();

        // Add to history display
        addTxToHistory('topup', `Top Up`, formatRp(amount), 'Baru saja');

      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Konfirmasi Top Up';
      }
    }

    function addTxToHistory(type, label, amount, time) {
      const container = document.getElementById('tx-history');
      // Remove empty state
      if (container.querySelector('[style*="text-align:center"]')) {
        container.innerHTML = '';
      }

      const iconClass = type === 'topup' ? 'tx-icon--topup' : 'tx-icon--fee';
      const iconEmoji = type === 'topup' ? '💰' : '📋';
      const amountClass = type === 'topup' ? 'tx-amount--plus' : 'tx-amount--minus';
      const prefix = type === 'topup' ? '+' : '-';

      const div = document.createElement('div');
      div.className = 'tx-item';
      div.innerHTML = `
        <div class="tx-icon ${iconClass}">${iconEmoji}</div>
        <div class="tx-info"><strong>${label}</strong><span>${time}</span></div>
        <span class="tx-amount ${amountClass}">${prefix}${amount}</span>
      `;
      container.prepend(div);
    }

    // ─── Init ───
    document.addEventListener('DOMContentLoaded', loadBalance);
  </script>
</body>
</html>
