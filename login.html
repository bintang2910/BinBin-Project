<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — BinBin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>

<body class="auth-body">

  <!-- Floating Orbs Background -->
  <div class="auth-orb auth-orb--1"></div>
  <div class="auth-orb auth-orb--2"></div>
  <div class="auth-orb auth-orb--3"></div>

  <div class="auth-shell">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">⬡</div>
      <h1 class="auth-logo__text">Bin<span>Bin</span></h1>
    </div>

    <!-- Glass Card -->
    <div class="auth-card">
      <div class="auth-card__header">
        <h2>Welcome Back 👋</h2>
        <p>Sign in to continue saving together</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">

        <div class="auth-field">
          <input type="email" id="login-email" class="auth-input" placeholder=" " required />
          <label for="login-email" class="auth-label">Email Address</label>
          <div class="auth-field__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
          </div>
        </div>

        <div class="auth-field">
          <input type="password" id="login-password" class="auth-input" placeholder=" " required />
          <label for="login-password" class="auth-label">Password</label>
          <div class="auth-field__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
          <button type="button" class="auth-toggle-pw" onclick="togglePw('login-password', this)"
            aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <div class="auth-extras">
          <label class="auth-checkbox">
            <input type="checkbox" checked />
            <span>Remember me</span>
          </label>
          <a href="#" class="auth-link-sm">Forgot password?</a>
        </div>

        <button type="submit" class="auth-btn" id="btn-login">
          <span>Sign In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>

      </form>

      <div class="auth-divider">
        <span>or continue with</span>
      </div>

      <div class="auth-social">
        <button class="auth-social-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          <span>Google</span>
        </button>
        <button class="auth-social-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
          </svg>
          <span>Apple</span>
        </button>
      </div>
    </div>

    <!-- Bottom Link -->
    <p class="auth-footer">
      Don't have an account? <a href="register.html" class="auth-link">Sign Up</a>
    </p>

  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script>
    const API = "http://" + window.location.hostname + ":3001";


    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      btn.innerHTML = '<span class="auth-spinner"></span> Signing in...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/sign-in/email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || data.error || 'Invalid email or password');
        }

        // Success → go to dashboard
        window.location.href = 'index.html';
      } catch (err) {
        btn.innerHTML = '<span>Sign In</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
        btn.disabled = false;
        showError(err.message);
      }
    }

    function showError(msg) {
      const old = document.querySelector('.auth-error');
      if (old) old.remove();
      const el = document.createElement('div');
      el.className = 'auth-error';
      el.style.cssText = 'background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:10px 14px; border-radius:8px; font-size:13px; font-weight:500; margin-bottom:16px; text-align:center;';
      el.textContent = '⚠️ ' + msg;
      document.querySelector('#login-form').prepend(el);
      setTimeout(() => el.remove(), 5000);
    }

    function togglePw(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.style.opacity = isPassword ? '1' : '0.5';
    }

    // Show toast if redirected from register
    const params = new URLSearchParams(window.location.search);
    if (params.get('registered') === 'true') {
      showToast('✅ Account created! Please sign in.');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('toast--visible'), 50);
      setTimeout(() => {
        toast.classList.remove('toast--visible');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
</body>

</html>
