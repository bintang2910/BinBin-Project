<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — BinBin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>

<body class="auth-body">

  <!-- Floating Orbs Background -->
  <div class="auth-orb auth-orb--1"></div>
  <div class="auth-orb auth-orb--2"></div>
  <div class="auth-orb auth-orb--3"></div>

  <div class="auth-shell">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">⬡</div>
      <h1 class="auth-logo__text">Bin<span>Bin</span></h1>
    </div>

    <!-- Glass Card -->
    <div class="auth-card">
      <div class="auth-card__header">
        <h2>Create Account ✨</h2>
        <p>Join thousands saving together on BinBin</p>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">

        <div class="auth-field">
          <input type="text" id="reg-name" class="auth-input" placeholder=" " required />
          <label for="reg-name" class="auth-label">Full Name</label>
          <div class="auth-field__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
        </div>

        <div class="auth-field">
          <input type="email" id="reg-email" class="auth-input" placeholder=" " required />
          <label for="reg-email" class="auth-label">Email Address</label>
          <div class="auth-field__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
          </div>
        </div>

        <div class="auth-field">
          <input type="password" id="reg-password" class="auth-input" placeholder=" " required minlength="6" />
          <label for="reg-password" class="auth-label">Password</label>
          <div class="auth-field__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
          <button type="button" class="auth-toggle-pw" onclick="togglePw('reg-password', this)"
            aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <div class="auth-field">
          <input type="password" id="reg-confirm" class="auth-input" placeholder=" " required minlength="6" />
          <label for="reg-confirm" class="auth-label">Confirm Password</label>
          <div class="auth-field__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          </div>
        </div>

        <label class="auth-checkbox" style="margin-bottom:20px;">
          <input type="checkbox" required />
          <span>I agree to the <a href="#" class="auth-link" style="font-size:13px;">Terms of Service</a> & <a href="#"
              class="auth-link" style="font-size:13px;">Privacy Policy</a></span>
        </label>

        <button type="submit" class="auth-btn" id="btn-register">
          <span>Create Account</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>

      </form>
    </div>

    <!-- Bottom Link -->
    <p class="auth-footer">
      Already have an account? <a href="login.html" class="auth-link">Sign In</a>
    </p>

  </div>

  <script>
    const API = "http://" + window.location.hostname + ":3001";

    async function handleRegister(e) {
      e.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pw = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (pw !== confirm) {
        showError('Passwords do not match!');
        return;
      }

      const btn = document.getElementById('btn-register');
      btn.innerHTML = '<span class="auth-spinner"></span> Creating...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/sign-up/email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, email, password: pw }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || data.error || 'Registration failed');
        }

        // Success → redirect to login
        window.location.href = 'login.html?registered=true';
      } catch (err) {
        btn.innerHTML = '<span>Create Account</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
        btn.disabled = false;
        showError(err.message);
      }
    }

    function showError(msg) {
      // Remove existing error
      const old = document.querySelector('.auth-error');
      if (old) old.remove();
      const el = document.createElement('div');
      el.className = 'auth-error';
      el.style.cssText = 'background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:10px 14px; border-radius:8px; font-size:13px; font-weight:500; margin-bottom:16px; text-align:center;';
      el.textContent = '⚠️ ' + msg;
      document.querySelector('#register-form').prepend(el);
      setTimeout(() => el.remove(), 5000);
    }

    function togglePw(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.style.opacity = isPassword ? '1' : '0.5';
    }
  </script>
</body>

</html>
